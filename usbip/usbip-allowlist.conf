# One device per line:
# VID:PID:SERIAL
# VID:PID:*                 (any serial; use only when no serial is exposed)
# VID:PID:SERIAL:risky      (explicitly permit a normally blocked class)
#
# Hex VID/PID are four lowercase digits. Nothing is exported by default.
# Example specialty device (commented):
# 046d:c262:*               # Logitech G920 family; confirm your exact IDs
