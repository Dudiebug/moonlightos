name: release-v1.1

on:
  workflow_run:
    workflows: [build-and-smoke-test]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check v1.1 release eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$(< VERSION)" != 1.1 ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tagged_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v1.1" \
            --jq '.[] | select(.ref == "refs/tags/v1.1") | .object.sha')
          if [[ -n "$tagged_sha" && "$tagged_sha" != "$RELEASE_SHA" ]]; then
            echo "v1.1 already points to $tagged_sha; leaving it immutable."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Download the boot-tested ISO artifact
        if: steps.eligibility.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: moonlightos-1.1-amd64
          path: dist
          repository: Dudiebug/moonlightos
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SHA256 checksum
        if: steps.eligibility.outputs.publish == 'true'
        working-directory: dist
        run: sha256sum --check --strict moonlightos-1.1-amd64.iso.sha256

      - name: Publish release and upload ISO
        if: steps.eligibility.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v1.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.1 \
              --repo "$GITHUB_REPOSITORY" --clobber \
              dist/moonlightos-1.1-amd64.iso \
              dist/moonlightos-1.1-amd64.iso.sha256
            gh release edit v1.1 \
              --repo "$GITHUB_REPOSITORY" \
              --title "MoonlightOS v1.1" \
              --notes-file docs/releases/v1.1.md \
              --latest
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.1" \
              -f sha="$RELEASE_SHA" -F force=true >/dev/null
          else
            gh release create v1.1 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "MoonlightOS v1.1" \
              --notes-file docs/releases/v1.1.md \
              --latest \
              dist/moonlightos-1.1-amd64.iso \
              dist/moonlightos-1.1-amd64.iso.sha256
