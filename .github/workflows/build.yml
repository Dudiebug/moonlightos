name: build-and-smoke-test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl ca-certificates cpio debootstrap \
            debian-archive-keyring xorriso squashfs-tools grub-pc-bin \
            grub-efi-amd64-bin mtools dosfstools qemu-system-x86 ovmf ripgrep
          curl --fail --location --output /tmp/live-build.deb \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          sudo apt-get install --yes /tmp/live-build.deb
          lb --version
      - name: Source tests
        run: make test
      - name: Build ISO
        run: sudo make build
      - name: QEMU boot smoke test
        run: |
          if ! make qemu-smoke; then
            cat /tmp/moonlightos-qemu-smoke.log || true
            exit 1
          fi
        env:
          MOONLIGHTOS_QEMU_LOG: /tmp/moonlightos-qemu-smoke.log
          MOONLIGHTOS_QEMU_SCREENSHOT: /tmp/moonlightos-qemu-smoke.ppm
      - name: Upload failed boot diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: moonlightos-failed-boot-${{ github.run_id }}
          path: |
            /tmp/moonlightos-qemu-smoke.log
            /tmp/moonlightos-qemu-smoke.ppm
          if-no-files-found: warn
          retention-days: 2
      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: moonlightos-0.1.5-amd64
          path: build/out/moonlightos-0.1.5-amd64.iso
          if-no-files-found: error
