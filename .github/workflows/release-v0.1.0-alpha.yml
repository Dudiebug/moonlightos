name: release-v0.1.0-alpha

on:
  workflow_run:
    workflows: [build-and-smoke-test]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release notes
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download the boot-tested ISO artifact
        uses: actions/download-artifact@v5
        with:
          name: moonlightos-0.1.0-alpha-amd64
          path: dist
          repository: Dudiebug/moonlightos
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SHA256 checksum
        working-directory: dist
        run: sha256sum --check --strict moonlightos-0.1.0-alpha-amd64.iso.sha256

      - name: Publish prerelease and upload ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v0.1.0-alpha --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.1.0-alpha \
              --repo "$GITHUB_REPOSITORY" --clobber \
              dist/moonlightos-0.1.0-alpha-amd64.iso \
              dist/moonlightos-0.1.0-alpha-amd64.iso.sha256
            gh release edit v0.1.0-alpha \
              --repo "$GITHUB_REPOSITORY" \
              --title "MoonlightOS v0.1.0-alpha" \
              --notes-file docs/releases/v0.1.0-alpha.md \
              --prerelease
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.1.0-alpha" \
              -f sha="$RELEASE_SHA" -F force=true >/dev/null
          else
            gh release create v0.1.0-alpha \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "MoonlightOS v0.1.0-alpha" \
              --notes-file docs/releases/v0.1.0-alpha.md \
              --prerelease \
              dist/moonlightos-0.1.0-alpha-amd64.iso \
              dist/moonlightos-0.1.0-alpha-amd64.iso.sha256
          fi
